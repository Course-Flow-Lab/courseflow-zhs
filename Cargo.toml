[package]
name = "courseflow-zhs"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Protocol crypto only: the 智慧树 bootstrap handshake (RSA PKCS#1 v1.5) and
# AES-128-CBC request signing. No HTTP stack: every request goes through cw.net.fetch.
rsa = "0.9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rand = "0.8"

[profile.release]
strip = true
